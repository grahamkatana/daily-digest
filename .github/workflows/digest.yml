name: Daily Research Digest

on:
  schedule:
    - cron: "30 5 * * *"  # 07:30 SAST (UTC+2, South Africa has no DST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - run: uv sync

      - run: uv run python -m digest.main
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit updated digest state
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/seen.json digests/
          git diff --cached --quiet || git commit -m "chore: digest run $(date -u +%Y-%m-%d)"
          git push
