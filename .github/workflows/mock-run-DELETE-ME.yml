name: TEMP - Mock Digest Run (delete after verifying)

on:
  push:

permissions:
  contents: write

jobs:
  mock-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync

      - run: uv run python -m digest.main --force
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit updated digest state
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/seen.json digests/
          git diff --cached --quiet || git commit -m "test: mock run $(date -u +%Y-%m-%d)"
          git push
